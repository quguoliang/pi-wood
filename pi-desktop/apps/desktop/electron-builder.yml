appId: dev.pidesk.desktop
productName: PiDesk
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
npmRebuild: true
