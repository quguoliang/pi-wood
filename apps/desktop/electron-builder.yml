appId: dev.pi-wood.app
productName: pi-wood
directories:
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
# T8.0/P1-d 缺口已在 T8.1 关闭：引擎子进程入口不再是散落在源码树的 .mjs，而是 main 的
#   **第二个 rollup 入口**（electron.vite.config.ts → out/main/engine-child.js），
#   与 index.js 同目录，随上面的 out/** 一起进 app.asar。
#   - 不列 extraResources：那会把入口落到 app 树外，child 里 import "@earendil-works/pi-coding-agent"
#     会沿 app.asar.unpacked/ → resources/ 找 node_modules 而解析失败。
#   - 默认不 asarUnpack：child 从 asar 内加载时，bare 依赖仍按 app 根解析。
#     若打包态探针（probe:conversation:packaged）报「入口存在但加载失败 / Cannot find package」，
#     再补 asarUnpack: [ "out/main/engine-child.js", "out/main/chunks/**" ] —— 必须连共享 chunk 一起
#     unpack，否则入口能读到、它 import 的 chunk 读不到（T8.0 踩过的 workspace 映射坑同源）。
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
npmRebuild: true
